# 示例 GitHub Actions 工作流（把它放到仓库根的 .github/workflows/ci.yml 即可生效）。
# 关键点：① 锁定 Node 版本满足 Vite 8（20.19+/22.12+）；② 缓存依赖安装；
#         ③ 类型检查与构建分开（Vite 只转译不做类型检查，CI 要单独卡 tsc）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 自动缓存 ~/.npm，按 package-lock.json 命中，省掉重复下载。
          cache: 'npm'

      # CI 用 npm ci：严格按 lock 文件安装，可复现、更快。
      - run: npm ci

      # Vite 不做类型检查 —— TS 项目必须在 CI 单独卡一道。
      # 本 demo 是纯 JS（无 tsconfig），故注释掉；TS 项目请取消下一行注释：
      # - run: npx tsc --noEmit

      - run: npm run build

      # 把构建产物作为 artifact 上传，供后续部署作业取用。
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
